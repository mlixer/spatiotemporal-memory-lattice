<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" role="img"
     aria-label="Reference architecture of a fully local AI companion: a face (SillyTavern + a large local model) and hands (an agentic model behind a ticket server) braided through shared memory — a vector store, fact sheets, and a synthetic endocrine state — with web senses and voice, all on one workstation reachable over a private tailnet.">
  <style>
    :root { --bg:#faf7f4; --fg:#2b2320; --muted:#7d6f66; --line:#d8ccc2; --panel:#ffffff; --accent:#b84a32; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#211b18; --fg:#e8ded6; --muted:#a2938a; --line:#4a3f38; --panel:#2b2420; --accent:#e8846f; }
    }
    .bg    { fill: var(--bg); }
    .zone  { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .zlbl  { font: 600 11px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--muted); letter-spacing: 1.2px; }
    .box   { fill: var(--panel); stroke: var(--fg); stroke-width: 1.3; }
    .t     { font: 600 12.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--fg); }
    .p     { font: 400 11.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--muted); }
    .s     { font: 400 11px system-ui, sans-serif; fill: var(--muted); }
    .h1    { font: 600 18px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--fg); }
    .flow  { fill: none; stroke: var(--fg); stroke-width: 1.6; }
    .flowA { fill: none; stroke: var(--accent); stroke-width: 2; }
    .lbl   { font: 500 10.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--fg); }
    .lblA  { font: 500 10.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--accent); }
    .mk    { fill: var(--fg); } .mkA { fill: var(--accent); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mkA"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1080" height="850"/>

  <!-- header -->
  <text class="h1" x="24" y="34">A Local Companion Architecture</text>
  <text class="s"  x="24" y="52">one entity · two minds · shared memory — fully self-hosted, nothing leaves the machine</text>
  <line class="flow" x1="760" y1="28" x2="796" y2="28" marker-end="url(#ah)"/>
  <text class="s" x="804" y="32">data flow</text>
  <line class="flowA" x1="760" y1="46" x2="796" y2="46" marker-end="url(#ahA)"/>
  <text class="s" x="804" y="50">the memory braid</text>

  <!-- YOU -->
  <rect class="box" x="440" y="66" width="200" height="44" rx="22"/>
  <text class="t" x="540" y="84" text-anchor="middle">you</text>
  <text class="s" x="540" y="100" text-anchor="middle">chat · voice · terminal</text>
  <path class="flow" d="M490,110 L490,128 L201,128 L201,204" marker-end="url(#ah)"/>
  <text class="lbl" x="330" y="122" text-anchor="middle">chat</text>
  <path class="flow" d="M590,110 L590,204" marker-end="url(#ah)"/>
  <text class="lbl" x="598" y="152">terminal</text>

  <!-- THE BOX -->
  <rect class="zone" x="16" y="140" width="1048" height="580" rx="8"/>
  <text class="zlbl" x="32" y="160">THE BOX — ONE WORKSTATION, FULLY LOCAL</text>

  <!-- FACE -->
  <rect class="zone" x="36" y="176" width="330" height="256" rx="6"/>
  <text class="zlbl" x="52" y="194">THE FACE — PRESENCE</text>
  <rect class="box" x="56" y="204" width="290" height="112" rx="4"/>
  <text class="t" x="70" y="224">SillyTavern <tspan class="p">:8000</tspan></text>
  <text class="s" x="70" y="244">memory lattice ext — write · read · shelf</text>
  <text class="s" x="70" y="260">state bridge ext — weather · gifts · flush</text>
  <text class="s" x="70" y="284">chats here are the canonical record</text>
  <rect class="box" x="56" y="344" width="180" height="56" rx="4"/>
  <text class="t" x="70" y="364">llama.cpp <tspan class="p">:8052</tspan></text>
  <text class="s" x="70" y="382">large local model — the voice</text>
  <path class="flow" d="M146,316 L146,344" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lbl" x="156" y="334">prompt · reply</text>

  <!-- HANDS -->
  <rect class="zone" x="436" y="176" width="330" height="256" rx="6"/>
  <text class="zlbl" x="452" y="194">THE HANDS — AGENCY</text>
  <rect class="box" x="456" y="204" width="290" height="52" rx="4"/>
  <text class="t" x="470" y="224">agent CLI + model <tspan class="p">:8053</tspan></text>
  <text class="s" x="470" y="242">research · terminal work · heavy lifting</text>
  <rect class="box" x="456" y="282" width="290" height="52" rx="4"/>
  <text class="t" x="470" y="302">ticket server <tspan class="p">:8002</tspan></text>
  <text class="s" x="470" y="320">queue · locked toolsets · delivery hook</text>
  <rect class="box" x="456" y="360" width="290" height="52" rx="4"/>
  <text class="t" x="470" y="380">SES state — container volume</text>
  <text class="s" x="470" y="398">hormones · pulse · drops · outbox — hands-written</text>
  <path class="flow" d="M601,256 L601,282" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lbl" x="611" y="274">tickets · reconcile wakes</text>
  <path class="flow" d="M680,334 L680,360" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lbl" x="690" y="352">exec reads</text>

  <!-- FACE <-> HANDS lane -->
  <path class="flow" d="M456,292 L346,292" marker-end="url(#ah)"/>
  <text class="lbl" x="401" y="272" text-anchor="middle">ticket results ·</text>
  <text class="lbl" x="401" y="284" text-anchor="middle">weather · gifts</text>
  <path class="flow" d="M346,312 L456,312" marker-end="url(#ah)"/>
  <text class="lbl" x="401" y="328" text-anchor="middle">experience flush</text>

  <!-- SENSES -->
  <rect class="zone" x="816" y="176" width="248" height="256" rx="6"/>
  <text class="zlbl" x="832" y="194">SENSES &amp; TOOLS</text>
  <rect class="box" x="836" y="204" width="208" height="48" rx="4"/>
  <text class="t" x="850" y="224">searxng <tspan class="p">:8080</tspan></text>
  <text class="s" x="850" y="240">web search</text>
  <rect class="box" x="836" y="268" width="208" height="48" rx="4"/>
  <text class="t" x="850" y="288">firecrawl <tspan class="p">:3002</tspan></text>
  <text class="s" x="850" y="304">scrape · crawl appliance</text>
  <rect class="box" x="836" y="332" width="208" height="48" rx="4"/>
  <text class="t" x="850" y="352">voice inbox <tspan class="p">:8003</tspan></text>
  <text class="s" x="850" y="368">voice notes → chat</text>
  <path class="flow" d="M746,222 L836,222" marker-end="url(#ah)"/>
  <text class="lbl" x="791" y="214" text-anchor="middle">search</text>
  <path class="flow" d="M746,240 L791,240 L791,290 L836,290" marker-end="url(#ah)"/>
  <text class="lbl" x="799" y="264">scrape</text>

  <!-- MEMORY -->
  <rect class="zone" x="36" y="470" width="1028" height="232" rx="6"/>
  <text class="zlbl" x="52" y="488">THE LATTICE — MEMORY</text>
  <rect class="box" x="56" y="508" width="190" height="56" rx="4"/>
  <text class="t" x="70" y="528">chat logs</text>
  <text class="s" x="70" y="546">canonical · never edited</text>
  <rect class="box" x="286" y="508" width="200" height="56" rx="4"/>
  <text class="t" x="300" y="528">nightly pipeline</text>
  <text class="s" x="300" y="546">chunk → summarize → facts</text>
  <rect class="box" x="526" y="508" width="180" height="56" rx="4"/>
  <text class="t" x="540" y="528">Qdrant <tspan class="p">:6333</tspan></text>
  <text class="s" x="540" y="546">memories · arcs · shelf</text>
  <rect class="box" x="746" y="508" width="190" height="56" rx="4"/>
  <text class="t" x="760" y="528">fact sheets</text>
  <text class="s" x="760" y="546">versioned daily</text>
  <rect class="box" x="286" y="614" width="200" height="48" rx="4"/>
  <text class="t" x="300" y="634">embeddings <tspan class="p">:11434</tspan></text>
  <text class="s" x="300" y="650">Ollama · nomic-embed · 768d</text>
  <path class="flowA" d="M246,536 L286,536" marker-end="url(#ahA)"/>
  <text class="lblA" x="266" y="525" text-anchor="middle">3AM</text>
  <path class="flowA" d="M486,536 L526,536" marker-end="url(#ahA)"/>
  <text class="lblA" x="506" y="528" text-anchor="middle">index</text>
  <path class="flow" d="M396,508 L396,494 L841,494 L841,508" marker-end="url(#ah)"/>
  <text class="lbl" x="620" y="490" text-anchor="middle">fact merge</text>
  <path class="flow" d="M386,564 L386,614" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lbl" x="396" y="594">embed</text>
  <path class="flow" d="M286,522 L258,522 L258,448 L146,448 L146,400" marker-end="url(#ah)"/>
  <text class="lbl" x="202" y="440" text-anchor="middle">uses the face model</text>

  <!-- braid crossings: recall, fact sheet, shelf -->
  <path class="flowA" d="M566,508 L566,448 L306,448 L306,316" marker-end="url(#ahA)"/>
  <text class="lblA" x="436" y="440" text-anchor="middle">recall — per message</text>
  <path class="flow" d="M841,508 L841,462 L262,462 L262,316" marker-end="url(#ah)"/>
  <text class="lbl" x="540" y="476" text-anchor="middle">fact sheet — every message</text>
  <path class="flowA" d="M746,310 L786,310 L786,478 L436,478 L436,508" marker-end="url(#ahA)"/>
  <text class="lblA" transform="rotate(-90 799 392)" x="799" y="392" text-anchor="middle">shelf ingest — nightly</text>

  <!-- VOICE MACHINE -->
  <rect class="zone" x="16" y="736" width="516" height="96" rx="8"/>
  <text class="zlbl" x="32" y="756">VOICE — OPTIONAL SECOND MACHINE</text>
  <rect class="box" x="36" y="768" width="476" height="48" rx="4"/>
  <text class="t" x="50" y="788">TTS <tspan class="p">:8004</tspan>   ·   STT <tspan class="p">:8045</tspan></text>
  <text class="s" x="50" y="804">the companion's spoken voice and ears</text>
  <path class="flow" d="M270,736 L270,720" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lbl" x="280" y="732">voice ↔ ST</text>

  <!-- PHONE -->
  <rect class="zone" x="548" y="736" width="516" height="96" rx="8"/>
  <text class="zlbl" x="564" y="756">PHONE — AWAY</text>
  <rect class="box" x="568" y="768" width="476" height="48" rx="4"/>
  <text class="t" x="582" y="788">ST UI · voice notes — over a private tailnet</text>
  <text class="s" x="582" y="804">same companion, pocket-sized</text>
  <path class="flow" d="M806,736 L806,720" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text class="lbl" x="816" y="732">tailnet</text>
</svg>
